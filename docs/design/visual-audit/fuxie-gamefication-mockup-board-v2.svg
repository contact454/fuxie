    <rect x="0" y="50" width="94" height="358" fill="#0A2F4F"/>
    <rect x="22" y="78" rx="8" width="50" height="50" fill="#FF6B35"/>
    <text x="31" y="111" class="labelWhite">Fx</text>
    <rect x="22" y="154" rx="8" width="50" height="46" fill="#FFFFFF" opacity="0.14"/>
    <rect x="22" y="216" rx="8" width="50" height="46" fill="#FFFFFF" opacity="0.14"/>
    <rect x="22" y="278" rx="8" width="50" height="46" fill="#FFFFFF" opacity="0.14"/>
    <rect x="122" y="76" rx="8" width="460" height="124" fill="url(#questHot)"/>
    <text x="150" y="115" class="tiny" fill="#FFF8E7">DAILY QUEST</text>
    <text x="150" y="151" class="h2 white">15 min to save streak</text>
    <text x="150" y="181" class="small" fill="#FFF8E7">Sprint + listen check = +45 XP</text>
    <rect x="430" y="130" rx="8" width="124" height="46" fill="#FFFFFF"/>
    <text x="455" y="160" class="labelDark">Hoc tiep</text>
    <g transform="translate(608 76)">
      <rect x="0" y="0" rx="8" width="174" height="124" fill="#F5FBFF" stroke="#CBE8F5" stroke-width="2"/>
      <path d="M58 29 C44 45, 44 66, 58 80 C74 96, 103 84, 102 59 C101 38, 80 23, 58 29Z" fill="#FF6B35"/>
      <path d="M54 31 L42 13 L64 26Z" fill="#FF6B35"/>
      <path d="M94 32 L111 14 L100 43Z" fill="#FF6B35"/>
      <ellipse cx="73" cy="68" rx="30" ry="21" fill="#FFF0E6"/>
      <circle cx="61" cy="58" r="4" fill="#102033"/>
      <circle cx="84" cy="58" r="4" fill="#102033"/>
      <text x="42" y="105" class="tiny ink">Coach: next action</text>
    </g>
    <g transform="translate(122 226)">
      <rect class="card" x="0" y="0" rx="8" width="186" height="124"/>
      <rect x="18" y="18" rx="8" width="42" height="42" fill="#E9FBF8"/>
      <path d="M29 38 h21 M39 28 v21" stroke="#2EC4B6" stroke-width="5" stroke-linecap="round"/>
      <text x="18" y="84" class="labelDark">Word Sprint</text>
      <text x="18" y="108" class="tiny muted">+15 XP / 6 min</text>
      <rect class="card" x="210" y="0" rx="8" width="186" height="124"/>
      <rect x="228" y="18" rx="8" width="42" height="42" fill="#EEF4FF"/>
      <path d="M241 37 C248 28, 261 28, 268 37 M237 48 C248 61, 261 61, 272 48" stroke="#004E89" stroke-width="4" fill="none" stroke-linecap="round"/>
      <text x="228" y="84" class="labelDark">Listen Check</text>
      <text x="228" y="108" class="tiny muted">Unlock review</text>
      <rect x="420" y="0" rx="8" width="238" height="124" fill="#FFF6D6" stroke="#FFE2A0" stroke-width="2"/>
      <text x="440" y="36" class="tiny" fill="#9A6A00">REWARD PREVIEW</text>
      <text x="440" y="72" class="body ink">Badge + streak safe</text>
      <rect x="440" y="88" rx="8" width="116" height="26" fill="#FFB703"/>
      <text x="463" y="106" class="tiny ink">+45 XP</text>
    </g>
  </g>

