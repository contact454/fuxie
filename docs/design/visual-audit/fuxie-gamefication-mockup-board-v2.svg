<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1125" viewBox="0 0 1800 1125" role="img" aria-labelledby="title desc">
  <title id="title">Fuxie Quest Worlds Mockup Board V2</title>
  <desc id="desc">A benchmark-informed, more colorful gamified UI mockup board for Fuxie.</desc>
  <defs>
    <linearGradient id="topBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06243F"/>
      <stop offset="0.46" stop-color="#004E89"/>
      <stop offset="1" stop-color="#2EC4B6"/>
    </linearGradient>
    <linearGradient id="questHot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B35"/>
      <stop offset="0.54" stop-color="#FF4F76"/>
      <stop offset="1" stop-color="#FFD166"/>
    </linearGradient>
    <linearGradient id="questCool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#004E89"/>
      <stop offset="0.55" stop-color="#2EC4B6"/>
      <stop offset="1" stop-color="#8BD7FF"/>
    </linearGradient>
    <linearGradient id="mapWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7ED"/>
      <stop offset="0.5" stop-color="#E9FBF8"/>
      <stop offset="1" stop-color="#EEF4FF"/>
    </linearGradient>
    <linearGradient id="rewardGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE8A3"/>
      <stop offset="1" stop-color="#FFB703"/>
    </linearGradient>
    <linearGradient id="levelGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7AD857"/>
      <stop offset="1" stop-color="#2EC4B6"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#06243F" flood-opacity="0.18"/>
    </filter>
    <filter id="chipShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#06243F" flood-opacity="0.14"/>
    </filter>
    <style>
      .page { fill: #FFF8F1; }
      .screen { fill: #FFFFFF; stroke: #DCE6EF; stroke-width: 2; filter: url(#softShadow); }
      .ink { fill: #102033; }
      .muted { fill: #637083; }
      .white { fill: #FFFFFF; }
      .navy { fill: #06243F; }
      .blue { fill: #004E89; }
      .teal { fill: #2EC4B6; }
      .orange { fill: #FF6B35; }
      .yellow { fill: #FFD166; }
      .green { fill: #56B947; }
      .purple { fill: #7C3AED; }
      .pink { fill: #FF4F76; }
      .panelBg { fill: #F6FAFC; }
      .card { fill: #FFFFFF; stroke: #E2EAF1; stroke-width: 2; }
      .soft { fill: #F3F7FB; }
      .tiny { font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0; }
      .small { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 0; }
      .body { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 0; }
      .h3 { font-family: Inter, Arial, sans-serif; font-size: 24px; font-weight: 900; letter-spacing: 0; }
      .h2 { font-family: Inter, Arial, sans-serif; font-size: 34px; font-weight: 900; letter-spacing: 0; }
      .hero { font-family: Inter, Arial, sans-serif; font-size: 50px; font-weight: 900; letter-spacing: 0; }
      .path { fill: none; stroke: #8BD7FF; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
      .pathDone { fill: none; stroke: #FF6B35; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
      .dashPath { fill: none; stroke: #C7D5E4; stroke-width: 8; stroke-linecap: round; stroke-dasharray: 4 18; }
      .nodeText { font-family: Inter, Arial, sans-serif; font-size: 20px; font-weight: 900; fill: #FFFFFF; }
      .labelDark { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 900; fill: #102033; }
      .labelWhite { font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 900; fill: #FFFFFF; }
    </style>
  </defs>

  <rect class="page" width="1800" height="1125"/>
  <rect x="0" y="0" width="1800" height="158" fill="url(#topBand)"/>
  <rect x="0" y="136" width="1800" height="12" fill="#FF6B35"/>
  <rect x="0" y="148" width="1800" height="10" fill="#FFD166"/>
  <text x="64" y="75" class="hero white">Fuxie Quest Worlds V2</text>
  <text x="66" y="112" class="body" fill="#D7F7F1">Benchmark-informed direction: path clarity, character coaching, reward preview, premium focus.</text>

  <g transform="translate(1178 40)">
    <rect x="0" y="0" rx="8" width="154" height="42" fill="#FFFFFF" opacity="0.14"/>
    <text x="18" y="27" class="tiny" fill="#FFFFFF">Path clarity</text>
    <rect x="170" y="0" rx="8" width="180" height="42" fill="#FFFFFF" opacity="0.14"/>
    <text x="188" y="27" class="tiny" fill="#FFFFFF">Reward preview</text>
    <rect x="366" y="0" rx="8" width="128" height="42" fill="#FFFFFF" opacity="0.14"/>
    <text x="384" y="27" class="tiny" fill="#FFFFFF">Coach role</text>
  </g>

