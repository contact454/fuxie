    <rect class="screen" x="0" y="0" rx="16" width="816" height="408"/>
    <rect x="0" y="0" rx="16" width="816" height="408" fill="#FFFFFF"/>
    <rect x="0" y="0" rx="16" width="816" height="50" fill="#F6FAFC"/>
