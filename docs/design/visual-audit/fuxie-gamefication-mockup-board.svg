<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Fuxie Gamefication Mockup Board</title>
  <desc id="desc">Four visual concept panels for a gamified Fuxie learning experience.</desc>
  <defs>
    <linearGradient id="orangeTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B35"/>
      <stop offset="1" stop-color="#2EC4B6"/>
    </linearGradient>
    <linearGradient id="blueTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#004E89"/>
      <stop offset="1" stop-color="#2EC4B6"/>
    </linearGradient>
    <linearGradient id="greenOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4CAF50"/>
      <stop offset="1" stop-color="#FF6B35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f6f8fb; }
      .panel { fill: #ffffff; stroke: #e5e7eb; stroke-width: 2; filter: url(#shadow); }
      .label { font-family: Inter, Arial, sans-serif; font-size: 28px; font-weight: 800; fill: #111827; }
      .sub { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #64748b; }
      .tiny { font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #64748b; }
      .white { fill: #ffffff; }
      .orange { fill: #FF6B35; }
      .blue { fill: #004E89; }
      .teal { fill: #2EC4B6; }
      .green { fill: #4CAF50; }
      .muted { fill: #f1f5f9; }
      .line { stroke: #cbd5e1; stroke-width: 8; stroke-linecap: round; fill: none; }
      .path { stroke: #2EC4B6; stroke-width: 10; stroke-linecap: round; stroke-dasharray: 1 24; fill: none; }
      .stroke-orange { stroke: #FF6B35; stroke-width: 4; fill: none; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1000"/>
  <text x="70" y="70" class="label" font-size="34">Fuxie Gamefication Mockup Board</text>
  <text x="70" y="101" class="sub">Direction: mission hub, world map, feedback layer, adventure path</text>

  <!-- Panel 1 Dashboard -->
  <rect x="70" y="140" rx="28" ry="28" width="700" height="360" class="panel"/>
  <text x="105" y="195" class="label">1. Dashboard Mission Hub</text>
  <text x="105" y="222" class="sub">One daily mission, one strong action, visible reward.</text>
  <rect x="105" y="255" rx="24" width="630" height="118" fill="url(#orangeTeal)"/>
  <circle cx="165" cy="314" r="36" fill="#fff4ed"/>
  <text x="146" y="324" font-family="Inter,Arial" font-size="30" font-weight="900" fill="#FF6B35">Fx</text>
  <text x="220" y="303" font-family="Inter,Arial" font-size="25" font-weight="900" fill="#fff">Nhiem vu hom nay</text>
  <text x="220" y="334" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#fff7ed">Hoan thanh 15 phut de giu streak va nhan +30 XP</text>
  <rect x="585" y="287" rx="18" width="118" height="54" fill="#fff"/>
  <text x="613" y="321" font-family="Inter,Arial" font-size="17" font-weight="900" fill="#FF6B35">Hoc tiep</text>
  <rect x="105" y="398" rx="18" width="190" height="68" class="muted"/>
  <rect x="325" y="398" rx="18" width="190" height="68" class="muted"/>
  <rect x="545" y="398" rx="18" width="190" height="68" class="muted"/>
  <text x="130" y="427" class="tiny">Quest 1</text><text x="130" y="449" class="sub">Vocabulary</text>
  <text x="350" y="427" class="tiny">Quest 2</text><text x="350" y="449" class="sub">Listening</text>
  <text x="570" y="427" class="tiny">Reward</text><text x="570" y="449" class="sub">Streak safe</text>

  <!-- Panel 2 Vocabulary -->
  <rect x="830" y="140" rx="28" ry="28" width="700" height="360" class="panel"/>
  <text x="865" y="195" class="label">2. Vocabulary World Map</text>
  <text x="865" y="222" class="sub">Themes become places to explore, not only cards.</text>
  <path d="M925 395 C 1000 285, 1105 430, 1190 320 S 1370 380, 1445 280" class="path"/>
  <circle cx="925" cy="395" r="42" fill="#fff7ed" stroke="#FF6B35" stroke-width="6"/>
  <text x="894" y="403" font-family="Inter,Arial" font-size="18" font-weight="900" fill="#FF6B35">Person</text>
  <circle cx="1092" cy="370" r="36" fill="#ecfeff" stroke="#2EC4B6" stroke-width="5"/>
  <text x="1077" y="377" font-family="Inter,Arial" font-size="20" font-weight="900" fill="#2EC4B6">2</text>
  <circle cx="1265" cy="343" r="36" fill="#eef2ff" stroke="#94a3b8" stroke-width="5"/>
  <text x="1250" y="350" font-family="Inter,Arial" font-size="20" font-weight="900" fill="#64748b">3</text>
  <circle cx="1445" cy="280" r="36" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="5"/>
  <text x="1430" y="287" font-family="Inter,Arial" font-size="20" font-weight="900" fill="#94a3b8">4</text>
  <rect x="890" y="260" rx="20" width="250" height="74" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="916" y="290" class="tiny">Active island</text>
  <text x="916" y="313" font-family="Inter,Arial" font-size="20" font-weight="900" fill="#111827">Person - 34 tu</text>
  <rect x="1200" y="407" rx="18" width="250" height="58" fill="#FF6B35"/>
  <text x="1252" y="443" font-family="Inter,Arial" font-size="18" font-weight="900" fill="#fff">Luyen chu de</text>

  <!-- Panel 3 Skill Player -->
  <rect x="70" y="560" rx="28" ry="28" width="700" height="360" class="panel"/>
  <text x="105" y="615" class="label">3. Skill Player Feedback</text>
  <text x="105" y="642" class="sub">Game layer supports focus, not decoration.</text>
  <rect x="105" y="685" rx="22" width="410" height="180" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="135" y="724" font-family="Inter,Arial" font-size="18" font-weight="900" fill="#004E89">Cau 1/5</text>
  <rect x="135" y="746" rx="12" width="330" height="20" fill="#e2e8f0"/>
  <rect x="135" y="784" rx="12" width="250" height="20" fill="#e2e8f0"/>
  <rect x="135" y="826" rx="16" width="150" height="42" fill="#004E89"/>
  <text x="174" y="854" font-family="Inter,Arial" font-size="16" font-weight="900" fill="#fff">Goi y</text>
  <rect x="540" y="685" rx="22" width="190" height="180" fill="#ecfeff" stroke="#99f6e4"/>
  <circle cx="600" cy="745" r="36" fill="#fff"/>
  <text x="580" y="755" font-family="Inter,Arial" font-size="28" font-weight="900" fill="#2EC4B6">Fx</text>
  <text x="575" y="800" font-family="Inter,Arial" font-size="19" font-weight="900" fill="#111827">Tot lam!</text>
  <text x="572" y="830" class="sub">+10 XP</text>
  <rect x="560" y="885" rx="18" width="150" height="46" fill="#FF6B35"/>
  <text x="606" y="914" font-family="Inter,Arial" font-size="16" font-weight="900" fill="#fff">Tiep tuc</text>

  <!-- Panel 4 Course -->
  <rect x="830" y="560" rx="28" ry="28" width="700" height="360" class="panel"/>
  <text x="865" y="615" class="label">4. Course Adventure Path</text>
  <text x="865" y="642" class="sub">Modules are nodes with unlocks, rewards, and boss exam.</text>
  <path d="M925 835 C 990 720, 1088 850, 1160 720 S 1320 760, 1430 665" class="line"/>
  <circle cx="925" cy="835" r="42" fill="#4CAF50"/>
  <text x="912" y="845" font-family="Inter,Arial" font-size="22" font-weight="900" fill="#fff">1</text>
  <circle cx="1088" cy="802" r="40" fill="#FF6B35"/>
  <text x="1075" y="812" font-family="Inter,Arial" font-size="22" font-weight="900" fill="#fff">2</text>
  <circle cx="1222" cy="730" r="38" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="5"/>
  <text x="1209" y="740" font-family="Inter,Arial" font-size="22" font-weight="900" fill="#64748b">3</text>
  <circle cx="1430" cy="665" r="48" fill="url(#blueTeal)"/>
  <text x="1400" y="674" font-family="Inter,Arial" font-size="18" font-weight="900" fill="#fff">Exam</text>
  <rect x="910" y="675" rx="20" width="260" height="82" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="936" y="706" class="tiny">Next best action</text>
  <text x="936" y="730" font-family="Inter,Arial" font-size="20" font-weight="900" fill="#111827">Modul 1: Hallo!</text>
  <rect x="1210" y="810" rx="18" width="230" height="54" fill="#FF6B35"/>
  <text x="1274" y="844" font-family="Inter,Arial" font-size="17" font-weight="900" fill="#fff">Hoc tiep</text>
</svg>
