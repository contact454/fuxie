<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Fuxie Learner UI Production Mockup Board v1</title>
  <desc id="desc">Five Fuxie German Village learner UI mockup panels for Dashboard, Course, Vocabulary, Skill Player, and Market Inventory.</desc>
  <defs>
    <linearGradient id="skySurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3FBFF"/>
      <stop offset="0.58" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CCE4F0"/>
    </linearGradient>
    <linearGradient id="tealSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAFBF8"/>
      <stop offset="1" stop-color="#D8F0F0"/>
    </linearGradient>
    <linearGradient id="rewardSurface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7D6"/>
      <stop offset="1" stop-color="#FFE7A6"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#3C78A8" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #F6FBFF; }
      .panel { fill: url(#skySurface); stroke: #FFFFFF; stroke-width: 2; filter: url(#softShadow); }
      .chip { fill: #EAFBF8; stroke: #BFEFE5; stroke-width: 1; }
      .ink { fill: #173B56; font-family: Inter, Arial, sans-serif; font-weight: 800; }
      .muted { fill: #3C78A8; font-family: Inter, Arial, sans-serif; font-weight: 700; }
      .tiny { fill: #64748B; font-family: Inter, Arial, sans-serif; font-weight: 700; }
      .label { fill: #3C78A8; font-family: Inter, Arial, sans-serif; font-size: 15px; font-weight: 900; }
      .h1 { font-size: 30px; }
      .h2 { font-size: 21px; }
      .body { font-size: 14px; }
      .brand { fill: #60A8E4; }
      .deep { fill: #3C78A8; }
      .teal { fill: #2EC4B6; }
      .amber { fill: #FFB703; }
      .white { fill: #FFFFFF; }
      .line { stroke: #60A8E4; stroke-width: 9; stroke-linecap: round; fill: none; opacity: 0.45; }
      .thinLine { stroke: #2EC4B6; stroke-width: 4; stroke-linecap: round; fill: none; }
      .node { fill: #FFFFFF; stroke: #60A8E4; stroke-width: 4; }
      .nodeActive { fill: #2EC4B6; stroke: #FFFFFF; stroke-width: 5; }
      .button { fill: #60A8E4; }
      .buttonText { fill: #FFFFFF; font-family: Inter, Arial, sans-serif; font-size: 15px; font-weight: 900; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1120"/>
  <text x="64" y="76" class="ink h1">Fuxie Learner UI Production Mockup Board v1</text>
  <text x="64" y="106" class="muted body">Moderate German Village layer: study-first hierarchy, reusable assets, no decorative takeover.</text>

  <g transform="translate(64,150)">
    <rect class="panel" width="450" height="420" rx="8"/>
    <text x="28" y="44" class="label">1. Dashboard / Village Square</text>
    <text x="28" y="76" class="ink h2">Today&apos;s mission</text>
    <rect x="28" y="98" width="246" height="112" rx="8" fill="#FFFFFF" stroke="#CCE4F0"/>
    <rect x="48" y="120" width="70" height="10" rx="5" class="teal"/>
    <text x="48" y="154" class="ink body">15 minute quest</text>
    <text x="48" y="180" class="tiny body">Learn, earn, unlock next.</text>
    <rect x="48" y="224" width="150" height="42" rx="8" class="button"/>
    <text x="76" y="251" class="buttonText">Start quest</text>
    <rect x="294" y="98" width="128" height="168" rx="8" fill="url(#tealSurface)" stroke="#BFEFE5"/>
    <path d="M316 226 L344 182 L374 214 L400 156" class="thinLine"/>
    <rect x="318" y="128" width="78" height="50" rx="8" fill="#FFFFFF" opacity="0.86"/>
    <circle cx="336" cy="146" r="10" class="brand"/>
    <circle cx="366" cy="146" r="10" class="teal"/>
    <rect x="316" y="236" width="82" height="12" rx="6" class="deep" opacity="0.45"/>
    <g transform="translate(28,298)">
      <rect width="112" height="54" rx="8" class="chip"/>
      <circle cx="28" cy="27" r="13" class="amber"/>
      <text x="50" y="24" class="ink body">Fucoin</text>
      <text x="50" y="42" class="tiny body">+8 today</text>
    </g>
    <g transform="translate(154,298)">
      <rect width="112" height="54" rx="8" class="chip"/>
      <polygon points="28,12 34,24 47,26 37,36 40,50 28,43 16,50 19,36 9,26 22,24" class="amber"/>
      <text x="54" y="24" class="ink body">XP</text>
      <text x="54" y="42" class="tiny body">Level path</text>
    </g>
    <g transform="translate(280,298)">
      <rect width="142" height="54" rx="8" class="chip"/>
      <path d="M26 14 L42 24 L38 44 L14 44 L10 24 Z" fill="#D8F0F0" stroke="#2EC4B6" stroke-width="3"/>
      <text x="56" y="24" class="ink body">Freeze</text>
      <text x="56" y="42" class="tiny body">safe streak</text>
    </g>
  </g>

  <g transform="translate(574,150)">
    <rect class="panel" width="450" height="420" rx="8"/>
    <text x="28" y="44" class="label">2. Course / Signpost Path</text>
    <text x="28" y="76" class="ink h2">A1 path to next gate</text>
    <path d="M86 308 C142 230, 168 224, 218 184 C270 142, 318 154, 366 94" class="line"/>
    <circle cx="86" cy="308" r="34" class="nodeActive"/>
    <text x="70" y="315" class="buttonText">A1</text>
    <circle cx="206" cy="194" r="34" class="node"/>
    <text x="190" y="201" class="muted body">A2</text>
    <circle cx="352" cy="104" r="34" class="node"/>
    <text x="338" y="111" class="muted body">B1</text>
    <rect x="54" y="92" width="122" height="58" rx="8" fill="url(#rewardSurface)" stroke="#FFE1A6"/>
    <text x="76" y="128" class="ink body">CEFR badge</text>
    <rect x="232" y="278" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#CCE4F0"/>
    <text x="252" y="308" class="ink body">Next milestone</text>
    <text x="252" y="332" class="tiny body">3 lessons left</text>
    <rect x="252" y="356" width="118" height="38" rx="8" class="button"/>
    <text x="278" y="380" class="buttonText">Continue</text>
  </g>

  <g transform="translate(1084,150)">
    <rect class="panel" width="450" height="420" rx="8"/>
    <text x="28" y="44" class="label">3. Vocabulary / Collection Book</text>
    <text x="28" y="76" class="ink h2">Collect, practice, review</text>
    <rect x="34" y="104" width="382" height="214" rx="8" fill="#FFFFFF" stroke="#CCE4F0"/>
    <line x1="225" y1="104" x2="225" y2="318" stroke="#CCE4F0" stroke-width="2"/>
    <g transform="translate(58,132)">
      <rect width="132" height="64" rx="8" fill="#F3FBFF" stroke="#CCE4F0"/>
      <text x="18" y="30" class="ink body">Food set</text>
      <text x="18" y="50" class="tiny body">18/24 cards</text>
      <rect y="84" width="132" height="64" rx="8" fill="#EAFBF8" stroke="#BFEFE5"/>
      <text x="18" y="114" class="ink body">Travel set</text>
      <text x="18" y="134" class="tiny body">9/20 cards</text>
    </g>
    <g transform="translate(254,132)">
      <rect width="118" height="148" rx="8" fill="#FFFDF7" stroke="#FFE1A6"/>
      <circle cx="58" cy="48" r="28" class="amber" opacity="0.82"/>
      <rect x="26" y="92" width="64" height="10" rx="5" class="deep" opacity="0.45"/>
      <rect x="26" y="114" width="46" height="10" rx="5" class="teal" opacity="0.7"/>
    </g>
    <rect x="52" y="344" width="132" height="40" rx="8" class="button"/>
    <text x="80" y="370" class="buttonText">Practice</text>
    <rect x="210" y="344" width="92" height="40" rx="8" class="chip"/>
    <text x="232" y="370" class="muted body">Stamp</text>
    <rect x="320" y="344" width="82" height="40" rx="8" fill="url(#rewardSurface)" stroke="#FFE1A6"/>
    <text x="338" y="370" class="muted body">Card</text>
  </g>

  <g transform="translate(64,638)">
    <rect class="panel" width="706" height="386" rx="8"/>
    <text x="28" y="44" class="label">4. Skill Player / Motivation Layer</text>
    <rect x="28" y="72" width="430" height="250" rx="8" fill="#FFFFFF" stroke="#CCE4F0"/>
    <text x="56" y="112" class="ink h2">Exercise task stays dominant</text>
    <rect x="56" y="146" width="350" height="18" rx="9" fill="#E2E8F0"/>
    <rect x="56" y="184" width="298" height="18" rx="9" fill="#E2E8F0"/>
    <rect x="56" y="238" width="154" height="46" rx="8" fill="#F3FBFF" stroke="#CCE4F0"/>
    <rect x="232" y="238" width="154" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="486" y="72" width="190" height="250" rx="8" fill="url(#tealSurface)" stroke="#BFEFE5"/>
    <circle cx="528" cy="118" r="24" class="brand"/>
    <text x="560" y="108" class="ink body">Fuxie coach</text>
    <text x="560" y="132" class="tiny body">Focus cue</text>
    <rect x="512" y="164" width="132" height="10" rx="5" fill="#FFFFFF"/>
    <rect x="512" y="164" width="88" height="10" rx="5" class="teal"/>
    <text x="512" y="204" class="ink body">Reward preview</text>
    <circle cx="528" cy="240" r="15" class="amber"/>
    <polygon points="572,225 578,237 592,239 582,249 584,263 572,256 560,263 562,249 552,239 566,237" class="amber"/>
    <path d="M626 226 L646 238 L642 262 L610 262 L606 238 Z" fill="#D8F0F0" stroke="#2EC4B6" stroke-width="3"/>
    <rect x="28" y="344" width="238" height="24" rx="8" class="chip"/>
    <text x="50" y="362" class="muted body">Reading / Listening / Writing / Speaking</text>
  </g>

  <g transform="translate(830,638)">
    <rect class="panel" width="706" height="386" rx="8"/>
    <text x="28" y="44" class="label">5. Fuxie Market + Inventory</text>
    <rect x="28" y="72" width="192" height="250" rx="8" fill="url(#rewardSurface)" stroke="#FFE1A6"/>
    <text x="54" y="112" class="ink h2">Wallet</text>
    <circle cx="72" cy="154" r="25" class="amber"/>
    <text x="112" y="162" class="ink h2">320</text>
    <rect x="54" y="204" width="134" height="42" rx="8" class="button"/>
    <text x="84" y="231" class="buttonText">Earn more</text>
    <rect x="254" y="72" width="196" height="250" rx="8" fill="#FFFFFF" stroke="#CCE4F0"/>
    <text x="280" y="112" class="ink h2">Shop shelf</text>
    <g transform="translate(282,140)">
      <rect width="58" height="58" rx="8" fill="#F3FBFF" stroke="#CCE4F0"/>
      <rect x="76" width="58" height="58" rx="8" fill="#EAFBF8" stroke="#BFEFE5"/>
      <rect y="82" width="58" height="58" rx="8" fill="#FFF7D6" stroke="#FFE1A6"/>
      <rect x="76" y="82" width="58" height="58" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    </g>
    <rect x="484" y="72" width="192" height="250" rx="8" fill="#FFFFFF" stroke="#CCE4F0"/>
    <text x="510" y="112" class="ink h2">Backpack</text>
    <path d="M548 154 C548 122, 618 122, 618 154 L632 244 L534 244 Z" fill="#EAFBF8" stroke="#2EC4B6" stroke-width="4"/>
    <rect x="558" y="186" width="62" height="36" rx="8" fill="#FFFFFF" opacity="0.9"/>
    <text x="516" y="288" class="tiny body">owned + pending items</text>
    <rect x="28" y="344" width="206" height="24" rx="8" class="chip"/>
    <text x="50" y="362" class="muted body">learn -> earn -> save -> unlock</text>
  </g>
</svg>
