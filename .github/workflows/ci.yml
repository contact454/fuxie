name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-quick:
    # Runs the gamified-ui-asset-rollout fast invariants on every PR.
    # Chains: lint:asset-paths -> check:asset-integrity -> check:asset-audit
    #         -> check:locale-parity -> test:property
    # Block-on-failure is what the gamified-ui-asset-rollout task 2.6 requires.
    name: Quick checks (asset registry + locale + property)
    runs-on: ubuntu-latest
    # fuxie-content-review-board task 3.1: the Tier-1 German gate
    # (pnpm qa:german-lint --diff, added below) is deterministic + free, but it
    # needs a real LanguageTool server. By design the gate exits 2 (infraError,
    # never a false PASS) when LanguageTool is unreachable (Req 1.9), so a
    # BLOCKING step without this service would fail on EVERY run. We therefore
    # run LanguageTool as a service container and point the gate at it via
    # LANGUAGETOOL_URL. The single-service-in-check-quick approach is chosen over
    # splitting into verify because the gate is diff-scoped (usually 0 content
    # files on a PR) and so stays fast. hunspell is intentionally NOT installed:
    # it is a best-effort sub-check that self-skips (records a note) when absent,
    # so the gate still passes without it.
    services:
      # erikvl87/languagetool serves on container port 8010 (pinned to a real
      # LanguageTool release tag for amd64 / ubuntu-latest).
      languagetool:
        image: erikvl87/languagetool:6.7
        ports:
          - 8010:8010
    env:
      # Point the gate at the service container above (its default is :8081).
      LANGUAGETOOL_URL: http://localhost:8010
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run asset paths linter
        run: pnpm lint:asset-paths

      - name: Run asset registry integrity check
        run: pnpm check:asset-integrity

      - name: Run asset audit (debt tolerated)
        run: pnpm check:asset-audit
        continue-on-error: true

      - name: Run locale parity check
        run: pnpm check:locale-parity --skip-tsx-scan

      - name: Wait for LanguageTool to be ready
        # Brief readiness poll avoids flakiness on a cold service container.
        # The gate's own pingLanguageTool would also catch a not-ready server.
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8010/v2/languages > /dev/null; then
              echo "LanguageTool is ready"; exit 0
            fi
            echo "Waiting for LanguageTool ($i/30)..."; sleep 2
          done
          echo "LanguageTool did not become ready in time" >&2; exit 1

      - name: Run German language gate (Tier-1, blocking)
        # fuxie-content-review-board task 3.1 (Req 1.7, 7.5). block-on-error:
        # NO continue-on-error, so objective German errors block the PR. Backed
        # by the LanguageTool service container so the gate actually runs
        # instead of exiting 2 (infraError). Diff-scoped to changed content.
        run: pnpm qa:german-lint --diff

      - name: Run state shell coverage check
        run: pnpm check:state-shell-coverage

      - name: Run property tests
        run: pnpm test:property --exclude "**/exploration.spec.ts"

      - name: Run visual audit pack check (debt tolerated)
        run: pnpm check:visual-audit
        continue-on-error: true

  verify:
    name: Full verify + AI eval gate
    needs: check-quick
    runs-on: ubuntu-latest
    env:
      AUTH_COOKIE_SECRET: ci-placeholder-secret
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-firebase-api-key
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-firebase-project
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm check

      - name: AI eval gate
        run: |
          pnpm check:ai-eval
          cat tmp/ai-eval-runs/readout.md

  smoke-test:
    name: Production Hardening Smoke Test
    needs: check-quick
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fuxie
          POSTGRES_PASSWORD: fuxie_dev
          POSTGRES_DB: fuxie_dev
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U fuxie -d fuxie_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_COOKIE_SECRET: ci-placeholder-secret
      DATABASE_URL: postgresql://fuxie:fuxie_dev@127.0.0.1:5434/fuxie_dev
      DATABASE_URL_UNPOOLED: postgresql://fuxie:fuxie_dev@127.0.0.1:5434/fuxie_dev
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      FUXIE_DEV_AUTH_ENABLED: "true"
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-firebase-api-key
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-firebase-project
      PLAYWRIGHT_AUTOSTART_WEB: "1"
      REDIS_URL: redis://127.0.0.1:6380
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Sync smoke database schema
        run: pnpm --filter @fuxie/database exec prisma db push --skip-generate

      - name: Seed smoke database
        run: pnpm db:seed:dev

      - name: Install Playwright Browsers
        run: pnpm test:integration:install

      - name: Run Production Hardening Smoke Tests
        run: pnpm exec playwright test tests/integration/production-hardening-smoke.pw.spec.ts --config tests/integration/playwright.config.ts --project chromium-mobile-capture

      - name: Upload Playwright artifacts on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: production-hardening-smoke-artifacts
          path: tmp/playwright
          if-no-files-found: warn
          retention-days: 7

      - name: Send Slack Notification on Failure
        if: ${{ failure() && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          payload=$(node -e "const msg = `Fuxie CI Pipeline Fail: Production Hardening Smoke Test failed on branch ${process.env.GITHUB_REF_NAME} (commit: ${process.env.GITHUB_SHA}). View logs: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`; process.stdout.write(JSON.stringify({ text: msg }))")
          curl -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"

      - name: Send Discord Notification on Failure
        if: ${{ failure() && env.DISCORD_WEBHOOK_URL != '' }}
        run: |
          payload=$(node -e "const msg = `Fuxie CI Pipeline Fail: Production Hardening Smoke Test failed on branch ${process.env.GITHUB_REF_NAME} (commit: ${process.env.GITHUB_SHA}). View logs: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`; process.stdout.write(JSON.stringify({ content: msg }))")
          curl -H "Content-Type: application/json" -X POST -d "$payload" "$DISCORD_WEBHOOK_URL"
